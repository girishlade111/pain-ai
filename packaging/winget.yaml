ShortDescription: Local-first, cross-platform desktop AI agent with native GUI automation, voice captions, and permission gates.
Description: |
  pain ai (CLI alias: lsc) is a local-first, cross-platform personal AI agent.
  It features:
  - Claude-grade native GUI shell with dark/light trinity theme
  - Native Windows UI Automation (UIA) desktop control
  - Voice STT input with simultaneous TTS voice output and captions
  - Granular, immutable permission gating (deny > ask > allow)
  - Persistent SQLite FTS5 memory and natural-language cron scheduling
  - 2D companion overlay with real-time FSM sprite animation
Moniker: lsc
Tags:
  - ai
  - agent
  - assistant
  - automation
